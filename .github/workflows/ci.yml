name: CI

# 推送与 PR 到 main 时运行:类型/构建/测试三道关。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 与 Dockerfile(node:22-slim)对齐;better-sqlite3 v12 有 node22 预编译二进制
          cache: npm

      - name: Install deps
        run: npm ci

      # 关键:CI 是干净检出,没有 data/app.db。build 时静态采集 /export 等页面会读库,
      # 若无表会报错,故先按迁移建好空库(空表足够让页面渲染空态,无需 seed)。
      - name: Apply DB migrations
        run: npm run db:migrate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Unit & integration tests
        run: npm test

      - name: Lint
        run: npm run lint
